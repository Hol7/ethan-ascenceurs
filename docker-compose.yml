version: "3.9"

services:
  db:
    image: mariadb:10.6
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: 1234
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - traefik

  wordpress:
    image: wordpress:6.8.3-php8.2-apache
    depends_on:
      - db
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: 1234
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
    networks:
      - traefik
    labels:
      - "traefik.enable=true"

      # 🔐 HTTPS router (MAIN)
      - "traefik.http.routers.ethan-wp.rule=Host(`ethan-ascenseur.com`)"
      - "traefik.http.routers.ethan-wp.entrypoints=websecure"
      - "traefik.http.routers.ethan-wp.tls.certresolver=letsencrypt"

      # 🔁 HTTP → HTTPS redirect
      - "traefik.http.routers.ethan-wp-http.rule=Host(`ethan-ascenseur.com`)"
      - "traefik.http.routers.ethan-wp-http.entrypoints=web"
      - "traefik.http.routers.ethan-wp-http.middlewares=redirect-to-https"

      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

      # 🐳 Apache listens on 80 INSIDE container (this is CORRECT)
      - "traefik.http.services.ethan-wp.loadbalancer.server.port=80"

volumes:
  db_data:
  wp_data:

networks:
  traefik:
    external: true


