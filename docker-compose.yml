services:
  db:
    image: mariadb:10.6
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: 1234
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - traefik

  wordpress:
    image: wordpress:6.8.3-php8.2-apache
    depends_on:
      - db
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: 1234
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
    networks:
      - traefik
    labels:
      - "traefik.enable=true"

      # -------------------------
      #  🔐 HTTPS (main router)
      # -------------------------
      - "traefik.http.routers.wordpress.rule=Host(`ethan-ascenceur.com`)"
      - "traefik.http.routers.wordpress.entrypoints=websecure"
      - "traefik.http.routers.wordpress.tls.certresolver=letsencrypt"
      - "traefik.http.services.wordpress.loadbalancer.server.port=80"

      # ------------------------------------------------------
      #  🔁 HTTP → HTTPS (force redirect)
      # ------------------------------------------------------
      - "traefik.http.routers.wordpress-http.rule=Host(`ethan-ascenceur.com`)"
      - "traefik.http.routers.wordpress-http.entrypoints=web"
      - "traefik.http.routers.wordpress-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

volumes:
  db_data: {}
  wp_data: {}

networks:
  traefik:
    external: true
